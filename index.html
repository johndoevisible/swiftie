<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="icon" type="image/png" href="swifter_favicon.png" />
  <title>Are you a swifter?</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      flex-direction: column;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow: hidden;
    }

    video {
      max-width: 100%;
      max-height: 80%;
      height: auto;
      width: auto;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .contact {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    .contact p {
      font-family: 'Bangers', cursive;
      font-size: 28px;
      letter-spacing: 2px;
      margin: 0;
    }

    .contact a {
      color: #ffeb3b;
      text-decoration: none;
      font-weight: bold;
      font-size: 24px;
      letter-spacing: 1px;
      transition: color 0.3s;
      animation: bounce 1s ease-in-out infinite;
    }

    .contact a:hover {
      color: #ff4081;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .song {
      visibility: hidden;
    }
  </style>
</head>

<body>

    <audio class="song" loop autoplay>
        <source src="remix.mpeg">
        </source>
        Your browser isn't invited for super fun audio time.
    </audio>

    <video controls autoplay loop muted playsinline>
        <source src="swiftie.mp4" type="video/mp4" />
        Your browser does not support the video tag.
    </video>

    <div class="contact">
        <p>Contact us at: <a href="mailto:benefits@bswift.in">benefits@bswift.in</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="application/javascript" src="main.js"></script>

</body>

</html>
